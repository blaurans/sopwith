<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sopwith - HTML/JS</title>
  <style>
    :root { color-scheme: dark; }
    html, body { margin: 0; height: 100%; background: #0b1020; font-family: system-ui, sans-serif; color: #e8eefc; }
    #wrap { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 12px; }
    canvas { background: linear-gradient(#87b6ff, #cfe8ff 55%, #7fb2ff 56%, #87b6ff); border: 2px solid #2b3a67; border-radius: 8px; image-rendering: pixelated; max-width: 100%; height: auto; }
    .hudline { font-size: 14px; opacity: 0.95; }
    .help { max-width: 960px; font-size: 13px; color: #b8c7e6; text-align: center; line-height: 1.4; }
    kbd { background: #1a2442; border: 1px solid #31406e; border-bottom-width: 2px; border-radius: 4px; padding: 1px 5px; font-family: inherit; font-size: 12px; color: #fff; }
  </style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="960" height="540"></canvas>
  <div class="hudline" id="status">Chargement...</div>
  <div class="help">
    <strong>Commandes :</strong>
    <kbd>↑</kbd>/<kbd>W</kbd> monter · <kbd>↓</kbd>/<kbd>S</kbd> descendre · <kbd>Espace</kbd> tirer · <kbd>B</kbd> bombe ·
    <kbd>←</kbd>/<kbd>→</kbd> ou <kbd>A</kbd>/<kbd>D</kbd> virer · <kbd>R</kbd> recommencer · <kbd>P</kbd> pause
    <br/>Détruisez tous les bâtiments ennemis. Revenez vous poser sur votre piste pour refaire le plein et les bombes.
  </div>
</div>
<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const statusEl = document.getElementById('status');
  const W = canvas.width, H = canvas.height;

  const WORLD_W = 4200;
  const GRAVITY = 0.08;
  const LIFT = 0.16;
  const DIVE = 0.12;
  const MAX_VY = 4.2;
  const MIN_SPEED = 1.8;
  const MAX_SPEED = 5.2;
  const THRUST = 0.03;
  const DRAG = 0.008;
  const BULLET_SPEED = 9;
  const FIRE_COOLDOWN = 8;
  const BOMB_COOLDOWN = 18;
  const MAX_FUEL = 1400;
  const MAX_BOMBS = 6;
  const MAX_AMMO = 120;
  const TURN_TIME = 22;

  const keys = new Set();
  let paused = false;

  function rand(a,b){ return a + Math.random()*(b-a); }
  function clamp(v,a,b){ return Math.max(a, Math.min(b,v)); }
  function wrapX(x){ x %= WORLD_W; if (x < 0) x += WORLD_W; return x; }
  function dxWrap(a,b){ let d = a-b; if (d > WORLD_W/2) d -= WORLD_W; if (d < -WORLD_W/2) d += WORLD_W; return d; }

  function makeTerrain() {
    const pts = [];
    const step = 40;
    let y = H - 90;
    for (let x=0; x<=WORLD_W; x+=step) {
      if (x < 260 || (x > 1800 && x < 2200) || x > WORLD_W-260) {
        y = H - 90;
      } else {
        y += rand(-28, 28);
        y = clamp(y, H - 180, H - 55);
        if (Math.random() < 0.15) y = H - 90;
      }
      pts.push({x, y});
    }
    return pts;
  }

  function groundYAt(x) {
    x = wrapX(x);
    const pts = terrain;
    const step = 40;
    const i = Math.floor(x / step);
    const i2 = (i + 1) % (pts.length - 1 === i ? pts.length - 1 : pts.length);
    const p1 = pts[i];
    const p2 = pts[i+1] || {x: WORLD_W, y: pts[0].y};
    const t = (x - p1.x) / Math.max(1, (p2.x - p1.x));
    return p1.y + (p2.y - p1.y) * clamp(t,0,1);
  }

  let terrain, player, bullets, bombs, explosions, enemyBullets, buildings, enemies, particles, score, lives, gameOver, win, message, messageT;

  function addExplosion(x,y,scale=1, color='#ffcf5a') {
    explosions.push({x:wrapX(x), y, r:2, max: 26*scale, life: 26, color});
    for (let i=0;i<10*scale;i++) {
      particles.push({x:wrapX(x), y, vx:rand(-2.5,2.5)*scale, vy:rand(-2.5,1.5)*scale, life: rand(18,35), color: i%2?color:'#fff2c7'});
    }
  }

  function resetGame(full=true) {
    terrain = makeTerrain();
    bullets = []; bombs = []; explosions = []; enemyBullets = []; particles = [];
    buildings = [];
    enemies = [];
    if (full) { score = 0; lives = 3; }
    gameOver = false; win = false; message = ''; messageT = 0;

    const homeX = 140;
    const homeY = groundYAt(homeX) - 8;
    player = {
      x: homeX, y: homeY, vy: 0, speed: 0, facing: 1, targetFacing: 1, turn: 0,
      fuel: MAX_FUEL, bombs: MAX_BOMBS, ammo: MAX_AMMO,
      fireCd: 0, bombCd: 0, onGround: true, alive: true, respawn: 0, inv: 0
    };

    const spots = [2050, 2250, 2450, 2650, 2850, 3050, 3250];
    const types = ['hangar','tour','usine','hangar','tour','usine','tour'];
    spots.forEach((sx,i) => {
      const gy = groundYAt(sx);
      const type = types[i % types.length];
      const h = type==='tour'?55:(type==='usine'?42:34);
      const w = type==='usine'?54:40;
      buildings.push({x:sx, y:gy-h, w, h, hp: type==='tour'?3:2, maxHp: type==='tour'?3:2, type, dead:false});
    });

    for (let i=0;i<3;i++) spawnEnemy(2600 + i*350);
  }

  function spawnEnemy(x) {
    const y = rand(90, H-240);
    enemies.push({x: wrapX(x ?? rand(1800, WORLD_W-300)), y, vy: rand(-0.5,0.5), speed: rand(2.2,3.2), facing: Math.random()<0.5?-1:1, fireCd: rand(40,90), alive:true, hp:2});
  }

  function killPlayer() {
    if (!player.alive || player.inv > 0) return;
    player.alive = false;
    addExplosion(player.x, player.y, 1.3, '#ff8a4a');
    lives--;
    message = lives > 0 ? 'Touché !' : 'Escadrille perdue';
    messageT = 120;
    if (lives > 0) player.respawn = 110; else gameOver = true;
  }

  function respawnPlayer() {
    const homeX = 140;
    player.x = homeX; player.y = groundYAt(homeX)-8; player.vy = 0; player.speed = 0;
    player.facing = 1; player.targetFacing = 1; player.turn = 0;
    player.fuel = MAX_FUEL; player.bombs = MAX_BOMBS; player.ammo = MAX_AMMO;
    player.onGround = true; player.alive = true; player.respawn = 0; player.inv = 120;
  }

  function tryLandOrTakeoff() {
    const homeX = 140;
    const nearHome = Math.abs(dxWrap(player.x, homeX)) < 60;
    const gy = groundYAt(player.x) - 8;
    if (player.onGround) {
      // takeoff happens naturally by gaining speed/lift; keep on runway while slow
      if (player.speed > 2.0 || player.y < gy - 2) player.onGround = false;
    } else {
      if (nearHome && player.y >= gy - 1 && player.vy >= -0.3 && player.vy < 2.2 && Math.abs(player.speed) < 3.2) {
        player.onGround = true; player.y = gy; player.vy = 0; player.speed = Math.max(0, player.speed - 0.08);
        player.fuel = Math.min(MAX_FUEL, player.fuel + 12);
        player.bombs = Math.min(MAX_BOMBS, player.bombs + 0.08);
        player.ammo = Math.min(MAX_AMMO, player.ammo + 1.2);
        if (player.fuel >= MAX_FUEL-1 && player.bombs >= MAX_BOMBS-0.1) { message = 'Ravitaillement terminé'; messageT = 50; }
      }
    }
  }

  function updatePlayer() {
    if (!player.alive) {
      if (player.respawn > 0) { player.respawn--; if (player.respawn === 0 && lives > 0) respawnPlayer(); }
      return;
    }
    if (player.inv > 0) player.inv--;

    const up = keys.has('ArrowUp') || keys.has('KeyW');
    const down = keys.has('ArrowDown') || keys.has('KeyS');
    const left = keys.has('ArrowLeft') || keys.has('KeyA');
    const right = keys.has('ArrowRight') || keys.has('KeyD');
    const fire = keys.has('Space');
    const bombKey = keys.has('KeyB');

    if (player.turn <= 0) {
      if (left && player.facing === 1) { player.targetFacing = -1; player.turn = TURN_TIME; }
      else if (right && player.facing === -1) { player.targetFacing = 1; player.turn = TURN_TIME; }
    } else {
      player.turn--;
      if (player.turn === Math.floor(TURN_TIME/2)) player.facing = player.targetFacing;
      if (player.turn === 0) { player.facing = player.targetFacing; }
    }

    if (player.onGround) {
      if (up || right || left) player.speed += THRUST * 1.4;
      if (down) player.speed -= THRUST * 2.2;
      player.speed = clamp(player.speed, 0, MAX_SPEED);
      if (up && player.speed > 2.1) { player.onGround = false; player.vy = -1.6; }
      player.vy = 0;
      player.y = groundYAt(player.x) - 8;
    } else {
      player.speed += THRUST - (down ? 0.01 : 0) - (up ? 0.005 : 0);
      if (up) player.vy -= LIFT;
      if (down) player.vy += DIVE;
      player.vy += GRAVITY;
      if (!up && !down) player.vy *= 0.995;
      player.vy = clamp(player.vy, -MAX_VY, MAX_VY);
      player.speed = clamp(player.speed - DRAG + (down?0.02:0), MIN_SPEED*0.6, MAX_SPEED);
      player.y += player.vy;
      // stall-ish
      if (player.speed < MIN_SPEED) { player.vy += 0.06; }
    }

    player.x = wrapX(player.x + player.speed * player.facing);

    if (!player.onGround) player.fuel -= 0.35 + player.speed*0.03;
    if (player.fuel <= 0) { player.fuel = 0; player.vy += 0.12; message = 'Panne sèche !'; messageT = 40; }

    const gy = groundYAt(player.x) - 8;
    if (player.y > gy) {
      if (player.onGround) { player.y = gy; }
      else {
        const nearHome = Math.abs(dxWrap(player.x, 140)) < 60;
        if (nearHome && Math.abs(player.vy) < 2.0 && player.speed < 3.4) {
          player.onGround = true; player.y = gy; player.vy = 0;
        } else {
          player.y = gy; killPlayer(); return;
        }
      }
    }
    if (player.y < 18) { player.y = 18; if (player.vy < 0) player.vy = 0; }

    tryLandOrTakeoff();

    if (player.fireCd > 0) player.fireCd--;
    if (player.bombCd > 0) player.bombCd--;
    if (fire && player.fireCd === 0 && player.ammo >= 1 && !player.onGround) {
      bullets.push({x: player.x + player.facing*18, y: player.y+2, vx: player.facing*(BULLET_SPEED + player.speed), vy: player.vy*0.25, life: 70, friendly:true});
      player.fireCd = FIRE_COOLDOWN; player.ammo -= 1;
    }
    if (bombKey && player.bombCd === 0 && Math.floor(player.bombs) >= 1 && !player.onGround) {
      bombs.push({x: player.x, y: player.y+10, vx: player.facing*player.speed*0.9, vy: Math.max(0.5, player.vy)+0.8, friendly:true});
      player.bombCd = BOMB_COOLDOWN; player.bombs = Math.floor(player.bombs)-1;
    }
  }

  function updateBullets() {
    for (const arr of [bullets, enemyBullets]) {
      for (const b of arr) {
        b.x = wrapX(b.x + b.vx);
        b.y += b.vy;
        b.life--;
        if (b.y >= groundYAt(b.x)) { b.life = 0; addExplosion(b.x, groundYAt(b.x)-2, 0.3, '#d9d9d9'); }
      }
    }
    bullets = bullets.filter(b => b.life > 0);
    enemyBullets = enemyBullets.filter(b => b.life > 0 && b.y > 0 && b.y < H);
  }

  function updateBombs() {
    for (const b of bombs) {
      b.vy += 0.12;
      b.x = wrapX(b.x + b.vx);
      b.y += b.vy;
      if (b.y >= groundYAt(b.x)-2) {
        b.dead = true;
        addExplosion(b.x, groundYAt(b.x)-6, 1.0, '#ffb347');
        // damage buildings
        for (const bd of buildings) {
          if (bd.dead) continue;
          const dx = Math.abs(dxWrap(b.x, bd.x + bd.w/2));
          if (dx < bd.w/2 + 18 && groundYAt(bd.x+bd.w/2) - b.y < bd.h + 20) {
            bd.hp -= 2;
            if (bd.hp <= 0 && !bd.dead) { bd.dead = true; score += 150; addExplosion(bd.x+bd.w/2, bd.y+bd.h/2, 1.4, '#ff7b39'); }
          }
        }
        // damage enemies near blast
        for (const e of enemies) {
          if (!e.alive) continue;
          const dx = Math.abs(dxWrap(b.x, e.x));
          const dy = Math.abs(b.y - e.y);
          if (dx < 40 && dy < 40) { e.alive = false; score += 100; addExplosion(e.x, e.y, 1.0, '#ff7b39'); }
        }
        if (player.alive) {
          const dx = Math.abs(dxWrap(b.x, player.x));
          const dy = Math.abs(b.y - player.y);
          if (dx < 34 && dy < 34) killPlayer();
        }
      }
    }
    bombs = bombs.filter(b => !b.dead && b.y < H+20);
  }

  function updateEnemies() {
    for (const e of enemies) {
      if (!e.alive) continue;
      e.x = wrapX(e.x + e.speed * e.facing);
      e.y += e.vy + Math.sin((performance.now()/500) + e.x*0.01)*0.15;
      if (Math.random() < 0.02) e.vy = rand(-0.6,0.6);
      e.y = clamp(e.y, 60, H - 170);
      if (e.x < 1700 || e.x > WORLD_W-120) e.facing *= -1;
      if (Math.random() < 0.005) e.facing *= -1;

      const dx = dxWrap(player.x, e.x);
      const dy = player.y - e.y;
      if (player.alive && Math.sign(dx) === e.facing && Math.abs(dx) < 420 && Math.abs(dy) < 80) {
        if (e.fireCd <= 0) {
          enemyBullets.push({x:e.x + e.facing*16, y:e.y+2, vx:e.facing*7.2, vy:dy*0.01, life: 80});
          e.fireCd = rand(55, 110);
        }
      }
      if (e.fireCd > 0) e.fireCd--;

      // collide with player
      if (player.alive && player.inv<=0) {
        if (Math.abs(dxWrap(player.x,e.x)) < 22 && Math.abs(player.y-e.y) < 14) {
          e.alive = false; score += 100; addExplosion(e.x,e.y,1.1,'#ff8a4a'); killPlayer();
        }
      }
    }
    // bullets vs enemies
    for (const b of bullets) {
      for (const e of enemies) {
        if (!e.alive) continue;
        if (Math.abs(dxWrap(b.x,e.x)) < 18 && Math.abs(b.y-e.y) < 12) {
          b.life = 0; e.hp--; addExplosion(b.x,b.y,0.4,'#ffd36b');
          if (e.hp <= 0) { e.alive = false; score += 100; addExplosion(e.x,e.y,1.0,'#ff7b39'); }
        }
      }
      for (const bd of buildings) {
        if (bd.dead) continue;
        if (Math.abs(dxWrap(b.x, bd.x+bd.w/2)) < bd.w/2 && b.y > bd.y && b.y < bd.y+bd.h) {
          b.life = 0; bd.hp -= 1; addExplosion(b.x,b.y,0.3,'#ffd36b');
          if (bd.hp <= 0) { bd.dead = true; score += 150; addExplosion(bd.x+bd.w/2, bd.y+bd.h/2, 1.3, '#ff7b39'); }
        }
      }
    }
    // enemy bullets vs player
    for (const b of enemyBullets) {
      if (!player.alive || player.inv>0) continue;
      if (Math.abs(dxWrap(b.x, player.x)) < 16 && Math.abs(b.y - player.y) < 10) { b.life = 0; killPlayer(); }
    }

    // maintain some enemies
    const aliveEnemies = enemies.filter(e=>e.alive).length;
    if (aliveEnemies < 2 && Math.random() < 0.01) spawnEnemy(player.x + (Math.random()<0.5?-1:1)*rand(500,900));

    if (buildings.every(b=>b.dead) && !win) { win = true; message = 'Victoire ! Tous les bâtiments sont détruits.'; messageT = 9999; }
  }

  function updateFX() {
    for (const p of particles) { p.x = wrapX(p.x + p.vx); p.y += p.vy; p.vy += 0.03; p.life--; }
    particles = particles.filter(p=>p.life>0 && p.y < H+30);
    for (const e of explosions) { e.r += 1.6; e.life--; }
    explosions = explosions.filter(e=>e.life>0);
    if (messageT > 0) messageT--; else if (!win) message = '';
  }

  function update() {
    if (paused || gameOver || win) return;
    updatePlayer();
    updateBullets();
    updateBombs();
    updateEnemies();
    updateFX();
  }

  function worldToScreenX(x, camX) {
    let sx = x - camX;
    if (sx < -WORLD_W/2) sx += WORLD_W;
    if (sx >  WORLD_W/2) sx -= WORLD_W;
    return sx + W/2;
  }

  function drawTerrain(camX) {
    ctx.beginPath();
    let started = false;
    for (let sx = -80; sx <= W+80; sx += 20) {
      const wx = wrapX(camX + sx - W/2);
      const gy = groundYAt(wx);
      const px = sx;
      if (!started) { ctx.moveTo(px, H); ctx.lineTo(px, gy); started = true; }
      else ctx.lineTo(px, gy);
    }
    ctx.lineTo(W+80, H); ctx.closePath();
    ctx.fillStyle = '#3f7d3a'; ctx.fill();
    ctx.strokeStyle = '#2d5f2a'; ctx.lineWidth = 2; ctx.stroke();

    // runway
    const baseX = worldToScreenX(140, camX);
    const baseY = groundYAt(140);
    if (baseX > -120 && baseX < W+120) {
      ctx.fillStyle = '#666';
      ctx.fillRect(baseX-70, baseY-4, 140, 6);
      ctx.strokeStyle = '#ddd';
      ctx.setLineDash([8,8]); ctx.beginPath(); ctx.moveTo(baseX-55, baseY-1); ctx.lineTo(baseX+55, baseY-1); ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle = '#4a90d9'; ctx.fillRect(baseX-18, baseY-28, 36, 24);
      ctx.fillStyle = '#7ec0ff'; ctx.fillRect(baseX-10, baseY-22, 8, 8); ctx.fillRect(baseX+2, baseY-22, 8, 8);
    }
  }

  function drawBuilding(b, camX) {
    if (b.dead) return;
    const sx = worldToScreenX(b.x + b.w/2, camX);
    if (sx < -80 || sx > W+80) return;
    const x = sx - b.w/2, y = b.y;
    ctx.fillStyle = b.type==='tour' ? '#8a5a44' : (b.type==='usine' ? '#6b6f7a' : '#7a4f3a');
    ctx.fillRect(x, y, b.w, b.h);
    ctx.strokeStyle = '#2d211a'; ctx.strokeRect(x, y, b.w, b.h);
    ctx.fillStyle = '#d8e7ff';
    for (let wy=y+8; wy<y+b.h-6; wy+=12) for (let wx=x+6; wx<x+b.w-6; wx+=12) ctx.fillRect(wx,wy,5,5);
    if (b.hp < b.maxHp) {
      ctx.fillStyle = '#222'; ctx.fillRect(x, y-8, b.w, 4);
      ctx.fillStyle = '#e74c3c'; ctx.fillRect(x, y-8, b.w*(b.hp/b.maxHp), 4);
    }
  }

  function drawPlane(p, camX, colorMain='#e6edf7', colorAccent='#2f5da8', enemy=false) {
    const sx = worldToScreenX(p.x, camX);
    if (sx < -60 || sx > W+60) return;
    const sy = p.y;
    ctx.save();
    ctx.translate(sx, sy);
    ctx.scale(p.facing, 1);
    const tilt = clamp(p.vy * 0.06, -0.5, 0.5);
    ctx.rotate(tilt);
    // body
    ctx.fillStyle = colorMain;
    ctx.beginPath(); ctx.ellipse(0, 0, 16, 5, 0, 0, Math.PI*2); ctx.fill();
    // wings
    ctx.fillStyle = colorAccent;
    ctx.fillRect(-10, -10, 20, 3);
    ctx.fillRect(-8, 7, 16, 3);
    // tail
    ctx.fillRect(-15, -6, 5, 4);
    ctx.fillRect(-16, -2, 3, 6);
    // struts/prop
    ctx.strokeStyle = '#c9d6ea'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(-4,-7); ctx.lineTo(-2,0); ctx.moveTo(4,-7); ctx.lineTo(2,0); ctx.stroke();
    ctx.fillStyle = '#444'; ctx.fillRect(15,-1,2,2);
    if (!enemy && p.inv > 0 && Math.floor(performance.now()/80)%2===0) { ctx.globalAlpha = 0.4; }
    ctx.restore();
  }

  function draw() {
    ctx.clearRect(0,0,W,H);
    // sky already via css background; add clouds
    const camX = player ? player.x : 0;
    ctx.save();
    ctx.globalAlpha = 0.25; ctx.fillStyle = '#fff';
    for (let i=0;i<8;i++) {
      const wx = (i*600 + (performance.now()*0.01)) % WORLD_W;
      const sx = worldToScreenX(wx, camX);
      const y = 60 + (i%3)*35;
      if (sx>-100 && sx<W+100) { ctx.beginPath(); ctx.ellipse(sx,y,46,16,0,0,Math.PI*2); ctx.ellipse(sx+30,y+4,34,13,0,0,Math.PI*2); ctx.fill(); }
    }
    ctx.restore();

    drawTerrain(camX);
    for (const b of buildings) drawBuilding(b, camX);
    for (const e of enemies) if (e.alive) drawPlane(e, camX, '#f2d9d9', '#a33b3b', true);
    if (player && (player.alive || player.respawn>0)) drawPlane(player, camX, player.onGround?'#e6edf7':'#f4f8ff', '#2f5da8', false);

    // bullets/bombs
    ctx.fillStyle = '#fff7b0';
    for (const b of bullets) { const sx = worldToScreenX(b.x, camX); if (sx<0||sx>W) continue; ctx.fillRect(sx-2,b.y-1,4,2); }
    ctx.fillStyle = '#ffcf7a';
    for (const b of enemyBullets) { const sx = worldToScreenX(b.x, camX); if (sx<0||sx>W) continue; ctx.fillRect(sx-2,b.y-1,4,2); }
    ctx.fillStyle = '#2a2a2a';
    for (const b of bombs) { const sx = worldToScreenX(b.x, camX); if (sx<-10||sx>W+10) continue; ctx.beginPath(); ctx.arc(sx,b.y,3,0,Math.PI*2); ctx.fill(); }

    for (const p of particles) { const sx = worldToScreenX(p.x, camX); if (sx<0||sx>W) continue; ctx.globalAlpha = clamp(p.life/30,0,1); ctx.fillStyle = p.color; ctx.fillRect(sx, p.y, 2, 2); ctx.globalAlpha = 1; }
    for (const e of explosions) { const sx = worldToScreenX(e.x, camX); if (sx<-50||sx>W+50) continue; ctx.globalAlpha = e.life/26; ctx.strokeStyle = e.color; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(sx,e.y,e.r,0,Math.PI*2); ctx.stroke(); ctx.globalAlpha = 1; }

    // HUD
    ctx.fillStyle = 'rgba(8,12,24,0.45)'; ctx.fillRect(10,10,360,74);
    ctx.fillStyle = '#eaf2ff'; ctx.font = '16px system-ui, sans-serif';
    const fuelPct = Math.max(0, Math.floor((player.fuel/MAX_FUEL)*100));
    ctx.fillText(`Score: ${score}    Vies: ${lives}    Bombes: ${Math.floor(player.bombs)}`, 20, 32);
    ctx.fillText(`Carburant: ${fuelPct}%    Munitions: ${Math.floor(player.ammo)}`, 20, 54);
    const leftB = buildings.filter(b=>!b.dead).length;
    ctx.fillText(`Bâtiments ennemis: ${leftB}`, 20, 76);

    // fuel bar
    ctx.fillStyle = '#223'; ctx.fillRect(250, 40, 100, 10);
    ctx.fillStyle = fuelPct < 25 ? '#e74c3c' : '#58d68d'; ctx.fillRect(250, 40, 100*(fuelPct/100), 10);

    if (message) {
      ctx.fillStyle = 'rgba(0,0,0,0.45)'; ctx.fillRect(W/2-220, 18, 440, 34);
      ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.font = '20px system-ui, sans-serif'; ctx.fillText(message, W/2, 42); ctx.textAlign = 'start';
    }

    if (paused || gameOver || win) {
      ctx.fillStyle = 'rgba(5,8,16,0.55)'; ctx.fillRect(0,0,W,H);
      ctx.fillStyle = '#fff'; ctx.textAlign = 'center';
      ctx.font = 'bold 42px system-ui, sans-serif';
      ctx.fillText(win ? 'Victoire !' : (paused ? 'Pause' : 'Partie terminée'), W/2, H/2 - 10);
      ctx.font = '20px system-ui, sans-serif';
      ctx.fillText(win ? 'Tous les objectifs ennemis sont détruits.' : (paused ? 'Appuyez sur P pour reprendre' : 'Appuyez sur R pour rejouer'), W/2, H/2 + 28);
      ctx.textAlign = 'start';
    }
  }

  function loop() {
    update();
    draw();
    const st = player.onGround ? 'Au sol (ravitaillement)' : 'En vol';
    statusEl.textContent = `${st} — Vitesse ${player.speed.toFixed(1)} | Altitude ${Math.max(0, Math.floor(groundYAt(player.x)-player.y))}`;
    requestAnimationFrame(loop);
  }

  window.addEventListener('keydown', (e) => {
    if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)) e.preventDefault();
    keys.add(e.code);
    if (e.code === 'KeyP') paused = !paused;
    if (e.code === 'KeyR') resetGame(true);
  });
  window.addEventListener('keyup', (e) => keys.delete(e.code));

  resetGame(true);
  loop();
})();
</script>
</body>
</html>
